  <script>
    (function () {
      try {
        var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get: function () {
            return currentFetch;
          },
          set: function (fn) {
            currentFetch = fn;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) { }
    })();
  </script>
